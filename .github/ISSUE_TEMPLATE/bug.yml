name: Bug or production error
description: Record one reproducible bug or one root-cause repair outcome.
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        One issue equals one root-cause outcome that can be finished in one to three hours.

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Describe the affected user, client, workflow, or reliability impact.
      placeholder: What is broken, for whom, and how severe is it?
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior and evidence
      description: Give sanitized symptoms, timestamps, environment, and error evidence.
      placeholder: What happened? Include a Sentry link when applicable, but no secrets or personal data.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or detection path
      description: Provide the smallest reliable reproduction, or explain how monitoring detects the failure.
      placeholder: |
        1. Start from...
        2. Perform...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the observable fixed behavior, not the implementation method.
      placeholder: What succeeds after the root cause is repaired?
    validations:
      required: true

  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Split the outcome before filing if it cannot finish within three hours.
      options:
        - 1 hour
        - 2 hours
        - 3 hours
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: Include regression verification and non-recurrence evidence when applicable.
      placeholder: |
        - [ ] Root cause is repaired
        - [ ] Regression check passes
        - [ ] Sentry issue is resolved or monitored with evidence
    validations:
      required: true

  - type: input
    id: linear
    attributes:
      label: Linear issue
      description: Enter the owning Linear identifier.
      placeholder: ALE-123
    validations:
      required: true

  - type: textarea
    id: traceability
    attributes:
      label: Related links
      description: Add applicable Sentry issue, Slack thread, deployment, or customer-safe evidence links.
      placeholder: One link per line. Do not paste credentials or sensitive customer data.
    validations:
      required: false

  - type: dropdown
    id: data_impact
    attributes:
      label: Data impact
      description: Database work requires backup, rollback, and preview or isolated verification evidence.
      options:
        - None
        - Migration
        - Backup or preview database required
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I have not included credentials or sensitive customer, patient, or financial data.
          required: true
